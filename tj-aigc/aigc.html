<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 流式对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 16px;
            background-color: #f5f7fa;
            height: calc(100vh - 40px);
        }
        .container {
            display: flex;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
            height: 100%;
        }

        /* ===== 左侧边栏 ===== */
        .sidebar {
            width: 260px;
            background: #f8f9fc;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar-header h4 {
            font-size: 15px;
            color: #333;
        }
        .btn-new-session {
            padding: 8px 0;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background .2s;
        }
        .btn-new-session:hover {
            background: #4096ff;
        }
        .btn-new-session:disabled {
            background: #94bfff;
            cursor: not-allowed;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .history-group {
            padding: 4px 0;
        }
        .group-label {
            padding: 6px 16px 4px;
            font-size: 12px;
            color: #999;
            font-weight: 600;
        }
        .session-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            border-left: 3px solid transparent;
            transition: all .15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-item:hover {
            background: #eef2f7;
        }
        .session-item.active {
            background: #e6f0ff;
            border-left-color: #1677ff;
            color: #1677ff;
            font-weight: 500;
        }
        .session-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .session-time {
            font-size: 11px;
            color: #aaa;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .btn-del-session {
            display: none;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            padding: 0 2px;
            line-height: 1;
            height: auto;
            flex-shrink: 0;
            margin-left: 4px;
            border-radius: 3px;
            transition: all .15s;
        }
        .btn-del-session:hover {
            color: #ff4d4f;
            background: #fff0f0;
        }
        .session-item:hover .btn-del-session {
            display: inline-block;
        }

        /* ===== 右侧主区域 ===== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .header {
            padding: 16px 20px;
            background: #1677ff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h3 {
            font-size: 16px;
        }
        .session-id {
            font-size: 12px;
            opacity: 0.9;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        .msg-item {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-msg {
            align-items: flex-end;
        }
        .ai-msg {
            align-items: flex-start;
        }
        .msg-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .user-msg .msg-content {
            background: #1677ff;
            color: white;
            border-top-right-radius: 2px;
        }
        .ai-msg .msg-content {
            background: #e8edf3;
            color: #1f2937;
            border-top-left-radius: 2px;
        }

        /* 课程卡片样式 */
        .course-card {
            width: 70%;
            border: 1px solid #dcdfe6;
            border-radius: 10px;
            background: #fff;
            overflow: hidden;
        }
        .card-title {
            background: #1677ff;
            color: #fff;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 16px;
        }
        .card-body {
            padding: 14px 16px;
        }
        .card-row {
            display: flex;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .card-label {
            width: 90px;
            color: #666;
            flex-shrink: 0;
        }
        .card-value {
            color: #222;
        }
        .card-price {
            color: #f5222d;
            font-weight: bold;
            font-size: 15px;
        }
        .order-card .card-title {
            background: #52c41a;
        }
        .order-price {
            color: #f5222d;
            font-weight: bold;
            font-size: 15px;
        }
        .order-discount {
            color: #52c41a;
        }
        .order-coupon {
            color: #1677ff;
            font-style: italic;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        #questionInput {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            height: 50px;
        }
        #questionInput:focus {
            outline: none;
            border-color: #1677ff;
        }
        button {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            height: 50px;
        }
        #sendBtn {
            background: #1677ff;
            color: white;
        }
        #sendBtn:disabled {
            background: #94bfff;
            cursor: not-allowed;
        }
        #stopBtn {
            background: #ff4d4f;
            color: white;
        }
        #stopBtn:disabled {
            background: #ffb3b3;
            cursor: not-allowed;
        }
        #clearBtn {
            background: #eee;
            color: #333;
        }
        .loading-tip {
            color: #888;
            font-size: 13px;
            margin-left: 8px;
        }
        .empty-tip {
            padding: 40px 16px;
            text-align: center;
            color: #bbb;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 左侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4>历史会话</h4>
            <button class="btn-new-session" id="newSessionBtn">＋ 新建会话</button>
        </div>
        <div class="sidebar-list" id="sidebarList">
            <div class="empty-tip">暂无历史会话</div>
        </div>
    </div>

    <!-- 右侧主区域 -->
    <div class="main-area">
        <div class="header">
            <h3>AI 流式对话 (SSE)</h3>
            <div class="session-id">会话ID：<span id="sessionIdText">-</span></div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <textarea id="questionInput" placeholder="请输入你的问题..."></textarea>
            <button id="sendBtn">发送 <span class="loading-tip" id="loadingTip"></span></button>
            <button id="stopBtn" disabled>中断输出</button>
            <button id="clearBtn">清空会话</button>
        </div>
    </div>
</div>

<script>
    // ===== 全局变量 =====
    let currentSessionId = null;
    let eventSource = null;
    let currentReader = null;

    // 固定 Authorization Token（与之前一致）
    const AUTH_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJ1c2VyIjp7InVzZXJJZCI6Miwicm9sZUlkIjoyLCJyZW1lbWJlck1lIjpmYWxzZX0sImV4cCI6MTc4NzcyNTI0NH0.DQgcg1xDU2xmvgfab2jx4TWDHvFUuRWaw9JD4NEK2WX1tqh32pBTMPpItjiKtcoPMyRAJuoNVxHyhJujwujpAabtuzmQuMW-X6BWAhXBGxshpST5_I3LnKeOLTh-vHotV1JnnGBxdZdqynYcN8HEsotz7Yk5ZCbnFH7VpNz_JS4lyiDjHP7yYbFhx8YRIf3PpV30mgQBE-3pkGTKTDaG2Vx5bOK_GudaSarC0xVz9ldyqQBVD0M3jMVeqqfSpRlTOAIaWp-BIFS_dvNpjzhkjwAtdrPRewgsT_1zOu7dRgJz98Cpe6swVyCmnJeuoh9lqbe84Gedu8vpfl68pIuBYg";

    // DOM 引用
    const sessionIdText = document.getElementById('sessionIdText');
    const chatBox = document.getElementById('chatBox');
    const questionInput = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const loadingTip = document.getElementById('loadingTip');
    const sidebarList = document.getElementById('sidebarList');
    const newSessionBtn = document.getElementById('newSessionBtn');

    // ===== 工具函数 =====

    // 格式化时间
    function formatTime(dt) {
        const d = new Date(dt);
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // 通用 fetch 封装，自动携带 token
    async function apiFetch(url, options = {}) {
        const res = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': AUTH_TOKEN,
                ...(options.headers || {})
            }
        });
        if (!res.ok) throw new Error(`请求失败 ${res.status}: ${res.statusText}`);
        return res;
    }

    // ===== 消息渲染 =====

    function appendMessage(type, content) {
        const div = document.createElement('div');
        div.className = `msg-item ${type}-msg`;
        div.innerHTML = `<div class="msg-content">${content}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div.querySelector('.msg-content');
    }

    function renderCourseCard(course) {
        if (!course) return;
        const wrap = document.createElement('div');
        wrap.className = 'msg-item ai-msg';
        const card = document.createElement('div');
        card.className = 'course-card';
        card.innerHTML = `
            <div class="card-title">${course.name || '未知课程'}</div>
            <div class="card-body">
                <div class="card-row">
                    <span class="card-label">课程价格</span>
                    <span class="card-value card-price">¥${course.price}</span>
                </div>
                <div class="card-row">
                    <span class="card-label">学习有效期</span>
                    <span class="card-value">${course.validDuration} 个月</span>
                </div>
                <div class="card-row">
                    <span class="card-label">适用人群</span>
                    <span class="card-value">${course.usePeople || '无'}</span>
                </div>
                <div class="card-row">
                    <span class="card-label">课程简介</span>
                    <span class="card-value">${course.detail || '暂无介绍'}</span>
                </div>
            </div>
        `;
        wrap.appendChild(card);
        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderPreOrderCard(order) {
        if (!order) return;
        const wrap = document.createElement('div');
        wrap.className = 'msg-item ai-msg';
        const card = document.createElement('div');
        card.className = 'course-card order-card';
        card.innerHTML = `
            <div class="card-title">🛒 预下单信息</div>
            <div class="card-body">
                <div class="card-row">
                    <span class="card-label">课程数量</span>
                    <span class="card-value">${order.count} 个</span>
                </div>
                <div class="card-row">
                    <span class="card-label">总金额</span>
                    <span class="card-value order-price">¥${order.totalAmount}</span>
                </div>
                <div class="card-row">
                    <span class="card-label">优惠金额</span>
                    <span class="card-value order-discount">-¥${order.discountAmount}</span>
                </div>
                <div class="card-row">
                    <span class="card-label">优惠券</span>
                    <span class="card-value order-coupon">${order.couponName || '无'}</span>
                </div>
                <div class="card-row">
                    <span class="card-label">实付金额</span>
                    <span class="card-value order-price">¥${order.payAmount}</span>
                </div>
                <div class="card-row">
                    <span class="card-label">订单编号</span>
                    <span class="card-value">${order.orderId}</span>
                </div>
            </div>
        `;
        wrap.appendChild(card);
        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 渲染参数中的课程卡片
    function renderParamsCards(params) {
        if (!params) return;
        Object.values(params).forEach(val => {
            if (val && typeof val === 'object' && val.id && val.name) {
                renderCourseCard(val);
            }
        });
    }

    // ===== 历史会话列表 =====

    async function loadHistorySessions() {
        try {
            const res = await apiFetch('http://127.0.0.1:10010/ais/session/history');
            const data = await res.json();
            renderSidebar(data);
        } catch (e) {
            console.warn('加载历史会话失败', e);
        }
    }

    function renderSidebar(groups) {
        sidebarList.innerHTML = '';
        const keys = Object.keys(groups);
        if (keys.length === 0) {
            sidebarList.innerHTML = '<div class="empty-tip">暂无历史会话</div>';
            return;
        }
        // 自定义分组顺序
        const order = ['当天', '最近30天', '最近1年', '1年以上'];
        order.forEach(key => {
            const list = groups[key];
            if (!list || list.length === 0) return;
            const groupDiv = document.createElement('div');
            groupDiv.className = 'history-group';
            groupDiv.innerHTML = `<div class="group-label">${key}</div>`;
            list.forEach(session => {
                const item = document.createElement('div');
                item.className = 'session-item';
                if (session.sessionId === currentSessionId) {
                    item.classList.add('active');
                }
                item.dataset.sessionId = session.sessionId;
                item.innerHTML = `
                    <span class="session-title">${escapeHtml(session.title || '未命名会话')}</span>
                    <span class="session-time">${formatTime(session.updateTime)}</span>
                    <button class="btn-del-session" title="删除会话">×</button>
                `;
                item.querySelector('.btn-del-session').addEventListener('click', e => {
                    e.stopPropagation();
                    deleteSession(session.sessionId);
                });
                item.addEventListener('click', () => switchSession(session.sessionId));
                groupDiv.appendChild(item);
            });
            sidebarList.appendChild(groupDiv);
        });
    }

    // 简单的 HTML 转义
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ===== 创建新会话 =====

    async function createNewSession() {
        newSessionBtn.disabled = true;
        try {
            const res = await apiFetch('http://127.0.0.1:10010/ais/session?n=3', { method: 'POST' });
            const data = await res.json();
            // 切换到新会话
            currentSessionId = data.sessionId;
            sessionIdText.innerText = currentSessionId;
            chatBox.innerHTML = '';

            // 显示示例问题
            if (data.examples && data.examples.length > 0) {
                const exampleText = '你可以试试问这些问题：\n' + data.examples.map(e => `• ${e.describe || e.title}`).join('\n');
                appendMessage('ai', exampleText);
            }

            // 刷新历史会话列表
            await loadHistorySessions();
        } catch (e) {
            console.error('创建会话失败', e);
            appendMessage('ai', `创建会话失败：${e.message}`);
        } finally {
            newSessionBtn.disabled = false;
        }
    }

    // ===== 删除会话 =====

    async function deleteSession(sessionId) {
        if (!confirm('确定要删除该会话吗？')) return;
        try {
            await apiFetch(`http://127.0.0.1:10010/ais/session/history?sessionId=${sessionId}`, { method: 'DELETE' });
            // 如果删除的是当前会话，清空聊天区域
            if (sessionId === currentSessionId) {
                currentSessionId = null;
                sessionIdText.innerText = '-';
                chatBox.innerHTML = '';
            }
            await loadHistorySessions();
        } catch (e) {
            console.error('删除会话失败', e);
            appendMessage('ai', `删除会话失败：${e.message}`);
        }
    }

    // ===== 切换会话 =====

    async function switchSession(sessionId) {
        if (sessionId === currentSessionId) return;
        // 先中断当前流
        await stopStreamInternal();

        currentSessionId = sessionId;
        sessionIdText.innerText = sessionId;
        chatBox.innerHTML = '';

        // 更新侧边栏高亮
        document.querySelectorAll('.session-item').forEach(el => {
            el.classList.toggle('active', el.dataset.sessionId === sessionId);
        });

        try {
            const res = await apiFetch(`http://127.0.0.1:10010/ais/session/${sessionId}`);
            const messages = await res.json();
            messages.forEach(msg => {
                if (msg.type === 'USER' || msg.type === 1) {
                    appendMessage('user', msg.content);
                } else if (msg.type === 'ASSISTANT' || msg.type === 2) {
                    appendMessage('ai', msg.content);
                    // 渲染课程卡片
                    renderParamsCards(msg.params);
                }
            });
        } catch (e) {
            console.error('加载历史消息失败', e);
            appendMessage('ai', `加载历史消息失败：${e.message}`);
        }
    }

    // 内部中断（不刷新侧边栏）
    async function stopStreamInternal() {
        if (currentSessionId) {
            try {
                await fetch('http://127.0.0.1:10010/ais/chat/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': AUTH_TOKEN
                    },
                    body: JSON.stringify({ sessionId: currentSessionId })
                });
            } catch (e) {
                console.warn('调用停止接口异常', e);
            }
        }
        if (currentReader) {
            try { await currentReader.cancel(); } catch (e) {}
            currentReader = null;
        }
        sendBtn.disabled = false;
        stopBtn.disabled = true;
        loadingTip.innerText = '';
    }

    // ===== 发送 / 停止 / 清空 =====

    async function stopStream() {
        await stopStreamInternal();
    }

    async function sendChat() {
        const question = questionInput.value.trim();
        if (!question) return;
        if (!currentSessionId) {
            appendMessage('ai', '请先创建或选择一个会话');
            return;
        }

        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        questionInput.value = '';
        appendMessage('user', question);

        const aiDom = appendMessage('ai', '');
        let aiText = '';
        currentReader = null;

        sendBtn.disabled = true;
        stopBtn.disabled = false;
        loadingTip.innerText = '流式输出中...';

        try {
            const res = await fetch('http://127.0.0.1:10010/ais/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': AUTH_TOKEN
                },
                body: JSON.stringify({
                    question: question,
                    sessionId: currentSessionId
                })
            });

            if (!res.ok) throw new Error(`接口请求失败，状态码：${res.status}`);

            const reader = res.body.getReader();
            currentReader = reader;
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data:')) continue;
                    const jsonStr = line.replace('data:', '').trim();
                    if (!jsonStr) continue;
                    try {
                        const data = JSON.parse(jsonStr);
                        if (data.eventType === 1001 && data.eventData) {
                            aiText += data.eventData;
                            aiDom.innerText = aiText;
                            chatBox.scrollTop = chatBox.scrollHeight;
                        }
                        if (data.eventType === 1003 && data.eventData) {
                            const [key, val] = Object.entries(data.eventData)[0];
                            if (key === 'prePlaceOrder') {
                                renderPreOrderCard(val);
                            } else if (key.startsWith('courseInfo_')) {
                                renderCourseCard(val);
                            }
                        }
                        if (data.eventType === 1002) {
                            console.log('流式输出完成');
                            // 刷新历史会话列表（有新内容可能更新标题）
                            await loadHistorySessions();
                            await reader.cancel();
                            return;
                        }
                    } catch (e) {
                        console.warn('解析SSE数据失败', jsonStr, e);
                    }
                }
            }
        } catch (err) {
            console.error('SSE连接异常', err);
            appendMessage('ai', `请求异常：${err.message}`);
        } finally {
            sendBtn.disabled = false;
            stopBtn.disabled = true;
            loadingTip.innerText = '';
            if (currentReader) {
                try { await currentReader.cancel(); } catch (e) {}
                currentReader = null;
            }
        }
    }

    // ===== 事件绑定 =====

    sendBtn.addEventListener('click', sendChat);
    stopBtn.addEventListener('click', stopStream);
    newSessionBtn.addEventListener('click', createNewSession);

    questionInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat();
        }
    });

    clearBtn.addEventListener('click', () => {
        chatBox.innerHTML = '';
        if (eventSource) eventSource.close();
        if (currentReader) {
            currentReader.cancel();
            currentReader = null;
        }
        sendBtn.disabled = false;
        stopBtn.disabled = true;
        loadingTip.innerText = '';
    });

    // ===== 初始化：加载历史会话 =====
    loadHistorySessions();
</script>
</body>
</html>
