server:
  port: 8080

spring:
  application:
    name: human-graph

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:your-api-key}
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7

  redis:
    host: ${ai.redis.host:127.0.0.1}
    port: 6379
    password: ${tj.redis.password:123321} # 可选，如果 Redis 设置了密码
    database: 0



logging:
  level:
    root: INFO
    com.alibaba.cloud.ai.graph: DEBUG
    com.alibaba.cloud.ai.graph.interruptable: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"