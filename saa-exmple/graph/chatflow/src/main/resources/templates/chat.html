<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">ChatFlow 待办助手</title>
    <style>
        :root {
            --primary: #4f6ef7;
            --primary-dark: #3b55d6;
            --bg: #f4f5f7;
            --panel: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-light: #6b7280;
            --user-bubble: #4f6ef7;
            --assistant-bubble: #eef1ff;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            gap: 16px;
        }

        /* 左侧待办清单 */
        .todo-panel {
            width: 320px;
            flex-shrink: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header h2 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .session-badge {
            display: inline-block;
            font-size: 12px;
            color: var(--primary-dark);
            background: #eef1ff;
            border-radius: 999px;
            padding: 2px 10px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-list {
            list-style: none;
            padding: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .task-item {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #fafbff;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .task-num {
            color: var(--primary);
            font-weight: 600;
            flex-shrink: 0;
        }

        .task-empty {
            color: var(--text-light);
            font-size: 13px;
            text-align: center;
            padding: 32px 12px;
            line-height: 1.6;
        }

        /* 右侧对话区 */
        .chat-panel {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .chat-header h1 {
            font-size: 18px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
            line-height: 1.5;
        }

        .session-control {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .session-control input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .session-control input:focus {
            border-color: var(--primary);
        }

        .session-control button {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all .15s;
        }

        .session-control button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .msg.user .avatar {
            background: var(--primary);
            color: #fff;
        }

        .msg.assistant .avatar {
            background: #e5e7eb;
            color: var(--text);
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-top-right-radius: 4px;
        }

        .msg.assistant .bubble {
            background: var(--assistant-bubble);
            border-top-left-radius: 4px;
        }

        .typing {
            color: var(--text-light);
            font-style: italic;
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 12px;
        }

        .quick-chips button {
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #fff;
            color: var(--text-light);
            cursor: pointer;
            transition: all .15s;
        }

        .quick-chips button:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f5f7ff;
        }

        .chat-input {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
        }

        .chat-input textarea {
            flex: 1;
            resize: none;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            outline: none;
            max-height: 120px;
        }

        .chat-input textarea:focus {
            border-color: var(--primary);
        }

        .send-btn {
            padding: 10px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: background .15s;
        }

        .send-btn:hover {
            background: var(--primary-dark);
        }

        .send-btn:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="layout">
    <!-- 左侧：待办清单 -->
    <aside class="todo-panel">
        <div class="panel-header">
            <h2>待办清单</h2>
            <span class="session-badge" id="sessionBadge">会话: yjw</span>
        </div>
        <ul class="task-list" id="taskList">
            <li class="task-empty" id="taskEmpty">暂无待办。<br>试试输入「待办：学习TypeScript」</li>
        </ul>
    </aside>

    <!-- 右侧：对话区 -->
    <main class="chat-panel">
        <header class="chat-header">
            <h1 th:text="${pageTitle}">ChatFlow 待办助手</h1>
            <p class="subtitle">基于 StateGraph 的多轮待办助手：自动识别「创建待办」意图并累积到当前会话，其余输入走闲聊分支。</p>
            <div class="session-control">
                <input id="sessionId" th:value="${defaultSessionId}" placeholder="输入会话ID（不同ID隔离待办池）"/>
                <button id="newSessionBtn" title="清空本地聊天显示与待办列表">新建会话</button>
            </div>
        </header>

        <div class="chat-messages" id="chatMessages">
            <div class="msg assistant">
                <div class="avatar">AI</div>
                <div class="bubble">你好，我是待办助手。输入类似「待办：学习TypeScript」即可创建待办，也可以直接跟我闲聊。</div>
            </div>
        </div>

        <div class="quick-chips" id="quickChips">
            <button data-text="待办：学习TypeScript">待办：学习TypeScript</button>
            <button data-text="待办：用Ts做一个小demo">待办：用Ts做一个小demo</button>
            <button data-text="简单介绍下Spring Cloud">闲聊：Spring Cloud</button>
        </div>

        <div class="chat-input">
            <textarea id="userInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            <button class="send-btn" id="sendBtn">发送</button>
        </div>
    </main>
</div>

<script th:inline="javascript">
    const messagesEl = document.getElementById('chatMessages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const sessionInput = document.getElementById('sessionId');
    const newSessionBtn = document.getElementById('newSessionBtn');
    const taskList = document.getElementById('taskList');
    const taskEmpty = document.getElementById('taskEmpty');
    const sessionBadge = document.getElementById('sessionBadge');
    const quickChips = document.getElementById('quickChips');

    let tasks = [];

    function currentSession() {
        return sessionInput.value.trim() || 'yjw';
    }

    function appendMessage(role, content) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + role;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = content;

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderTasks() {
        taskList.innerHTML = '';
        if (!tasks.length) {
            taskList.appendChild(taskEmpty);
            taskEmpty.style.display = '';
            return;
        }
        tasks.forEach((t, i) => {
            const li = document.createElement('li');
            li.className = 'task-item';

            const num = document.createElement('span');
            num.className = 'task-num';
            num.textContent = (i + 1) + '.';

            const text = document.createElement('span');
            text.textContent = t;

            li.appendChild(num);
            li.appendChild(text);
            taskList.appendChild(li);
        });
    }

    function setLoading(loading) {
        sendBtn.disabled = loading;
        sendBtn.textContent = loading ? '思考中...' : '发送';
        if (!loading) {
            const typing = document.querySelector('.msg.typing');
            if (typing) typing.remove();
            return;
        }
        const wrap = document.createElement('div');
        wrap.className = 'msg assistant typing';
        wrap.textContent = 'AI 正在思考...';
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function send() {
        const userInput = inputEl.value.trim();
        if (!userInput) return;

        const sessionId = currentSession();
        sessionBadge.textContent = '会话: ' + sessionId;
        appendMessage('user', userInput);
        inputEl.value = '';
        inputEl.style.height = 'auto';
        setLoading(true);

        try {
            const url = '/assistant/chat?sessionId=' + encodeURIComponent(sessionId)
                + '&userInput=' + encodeURIComponent(userInput);
            const resp = await fetch(url, { method: 'POST' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const data = await resp.json();
            tasks = Array.isArray(data.tasks) ? data.tasks : [];
            renderTasks();
            appendMessage('assistant', data.reply || '（无回复）');
        } catch (e) {
            appendMessage('assistant', '请求失败：' + e.message);
        } finally {
            setLoading(false);
        }
    }

    sendBtn.addEventListener('click', send);

    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    newSessionBtn.addEventListener('click', () => {
        tasks = [];
        renderTasks();
        messagesEl.innerHTML = '';
        appendMessage('assistant', '已清空本地会话显示，开始新会话。');
        sessionBadge.textContent = '会话: ' + currentSession();
    });

    quickChips.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-text]');
        if (!btn) return;
        inputEl.value = btn.dataset.text;
        inputEl.focus();
    });

    sessionInput.addEventListener('change', () => {
        sessionBadge.textContent = '会话: ' + currentSession();
    });
</script>
</body>
</html>
