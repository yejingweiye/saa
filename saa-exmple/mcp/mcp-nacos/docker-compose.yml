version: '3.8'

services:
  nacos:
    image: nacos-registry.cn-hangzhou.cr.aliyuncs.com/nacos/nacos-server:v3.2.3
    container_name: nacos
    restart: always
    security_opt:
      - seccomp:unconfined # JDK17 docker兼容修复
    environment:
      MODE: standalone
      # -------- Nacos3鉴权必填 --------
      NACOS_AUTH_ENABLE: true
      NACOS_AUTH_TOKEN: VGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItbmFjcy1hdXRoLWRldi11c2U=
      NACOS_AUTH_IDENTITY_KEY: nacos.server.identity.key
      NACOS_AUTH_IDENTITY_VALUE: nacos.server.identity.value
      # JVM参数
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8080:8080"   # Nacos3网页控制台访问端口！浏览器访问 http://127.0.0.1:8080
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./nacos-data:/home/nacos/data
      - ./nacos-logs:/home/nacos/logs
    networks:
      nacos-net:
        aliases:
          - nacos-server

networks:
  nacos-net:
    driver: bridge