server:
  port: 8080

spring:
  application:
    name: vector-redis

  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}

    vectorstore:
      redis:
        initialize-schema: true
        prefix: prefix_spring_ai_alibaba
        index: index_spring_ai_alibaba

  data:
    redis:
      host: localhost
      port: 6379 # Redis服务器连接端口
      password: springaialibaba123456 # 补上redis密码，非常关键
