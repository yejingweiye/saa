server:
  port: 8061 # 服务器端口配置
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/nl2sql_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    enabled: true
    check-template-location: true
    prefix: classpath:/static/
    mvc:
      view:
        prefix: /static/
        suffix: .html
      static-path-pattern: /static/**
    resources:
      static-locations: classpath:/static/
  web:
    resources:
      static-locations: classpath:/static/
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-max
    mcp:
      server:
        name: yjw-server    # MCP服务器名称
        version: 0.0.1           # 服务器版本号
    vectorstore:
      analytic:
        enabled: false
        collectName: chatBi
        regionId: cn-hangzhou
        dbInstanceId:
        managerAccount:
        managerAccountPassword:
        namespace: chat
        namespacePassword: chat
        defaultTopK: 6
        defaultSimilarityThreshold: 0.75
        accessKeyId:
        accessKeySecret:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${AI_DASHSCOPE_API_KEY}
      model: qwen-max
chatBi:
  dbConfig:
    url:
    username:
    password:
    schema:
    connection-type: jdbc
    dialect-type: mysql
